<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Artificial Flattening/Steepening Demo</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .flex-col-center { width: 100%; max-width: 850px; }
    .demo-wrapper { width: 100%; margin-bottom: 1.5rem; }
    .demo-controls { margin-top: 1rem; width: 100%; }
    .control-row { display: flex; justify-content: space-between; font-weight:bold; color: #555; }
    .range-slider { width: 100%; cursor: pointer; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="flex-col-center">
    <h2 style="text-align: center;">Artificial Flattening / Steepening</h2>
    <div class="demo-wrapper">
      <svg viewBox="0 0 850 450" style="width:100%; height:auto;">
        <text x="-200" y="20" transform="rotate(-90)" text-anchor="middle" font-weight="bold" font-size="16" fill="#555">Metric Value</text>
        <text x="450" y="440" text-anchor="middle" font-weight="bold" font-size="16" fill="#555">Month of the Year</text>
        <line x1="70" y1="20" x2="70" y2="380" stroke="#333" stroke-width="2" />
        <line x1="70" y1="380" x2="830" y2="380" stroke="#333" stroke-width="2" />
        <g id="svgYAxis"></g>
        <g id="svgXAxis"></g>
        <polyline id="svgDataLine" fill="none" stroke="#0055cc" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"></polyline>
      </svg>
    </div>
    <div class="demo-controls">
      <div class="control-row"><span>Steepened</span><span>Flattened</span></div>
      <input type="range" id="svgScaleSlider" class="range-slider" min="0" max="100" value="50">
    </div>
  </div>
  <script>
    const data = [50, 52, 51, 54, 53, 56, 55, 58, 57, 60, 59, 62], labels = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const plotX = 70, plotY = 20, plotW = 760, plotH = 360, dx = plotW / 11;
    const line = document.getElementById('svgDataLine'), slider = document.getElementById('svgScaleSlider'), yAxisGroup = document.getElementById('svgYAxis'), xAxisGroup = document.getElementById('svgXAxis');
    
    labels.forEach((month, index) => {
      const x = plotX + (index * dx);
      xAxisGroup.innerHTML += `<text x="${x}" y="${plotY+plotH+25}" text-anchor="middle" font-size="14" fill="#666">${month}</text><line x1="${x}" y1="${plotY+plotH}" x2="${x}" y2="${plotY+plotH+5}" stroke="#333"/>`;
    });

    slider.addEventListener('input', () => {
      const val = parseInt(slider.value);
      let yMin, yMax, lineColor = "#0055cc";
      if (val <= 50) { let i = Math.pow((50-val)/50, 2); yMin = 0+(i*49); yMax = 100-(i*37); if(val<20) lineColor="#cc0000"; }
      else { let i = Math.pow((val-50)/50, 3); yMin = 0; yMax = 100+(i*1900); if(val>80) lineColor="#999999"; }

      yAxisGroup.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        const prop = i / 4, curY = yMin + (yMax - yMin) * prop, yPos = (plotY + plotH) - (prop * plotH);
        yAxisGroup.innerHTML += `<line x1="${plotX}" y1="${yPos}" x2="${plotX+plotW}" y2="${yPos}" stroke="#eee"/><text x="${plotX-10}" y="${yPos+5}" text-anchor="end" font-size="14" fill="#666">${curY>=1000?Math.round(curY/1000)+'k':Math.round(curY)}</text>`;
      }
      line.setAttribute("points", data.map((val, idx) => `${plotX + (idx*dx)},${(plotY+plotH) - ((val-yMin)/(yMax-yMin))*plotH}`).join(" "));
      line.setAttribute("stroke", lineColor);
    });
    slider.dispatchEvent(new Event('input'));
  </script>
</body>
</html>
