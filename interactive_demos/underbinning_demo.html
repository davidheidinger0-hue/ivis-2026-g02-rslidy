<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Underbinning Demo</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .flex-col-center { width: 100%; max-width: 850px; text-align: center; }
    .demo-wrapper { width: 100%; margin-bottom: 1.5rem; }
    .demo-controls { width: 100%; margin-top: 1rem; }
    .range-slider { width: 100%; cursor: pointer; margin-top: 1rem; }
    .control-row { display: flex; justify-content: space-between; font-size: 1rem; color: #888; }
    .text-bold { font-weight: bold; font-size: 1.3rem; }
  </style>
</head>
<body>
  <div class="flex-col-center">
    <h2>Underbinning</h2>
    <div class="demo-wrapper">
      <svg id="binSvg" style="width:100%; height:auto;" viewBox="0 0 850 450">
        <text x="-200" y="20" transform="rotate(-90)" text-anchor="middle" font-weight="bold" fill="#555">Frequency</text>
        <text x="450" y="440" text-anchor="middle" font-weight="bold" fill="#555">Value Range</text>
        <g id="binAxes"></g>
        <g id="binBars"></g>
      </svg>
    </div>
    <div class="demo-controls">
      <label for="binSlider" class="text-bold">Number of Bins: <span id="binCountDisplay">10</span></label>
      <input type="range" id="binSlider" class="range-slider" min="2" max="10" value="10" step="1">
      <div class="control-row"><span>Minimum (Misleading)</span><span>Maximum (Detailed)</span></div>
    </div>
  </div>
  <script>
    const binSlider = document.getElementById('binSlider'), binBarsGroup = document.getElementById('binBars'), binAxesGroup = document.getElementById('binAxes'), binDisplay = document.getElementById('binCountDisplay');
    const rawData = [12,14,15,15,16,17,18,18,19,20,21,22,23,23,24,25,26,27,28,28,29,30,31,32,33,34,35,65,66,67,68,69,70,71,72,73,74,75,76,77,78,79,80,81,82,83,84,85,86,88];
    const binPlotX = 70, binPlotY = 20, binPlotW = 760, binPlotH = 360;

    function renderBins() {
      const numBins = parseInt(binSlider.value);
      binDisplay.innerText = numBins;
      const binWidth = 100 / numBins, bins = Array(numBins).fill(0);
      rawData.forEach(val => { let idx = Math.floor(val / binWidth); if(idx >= numBins) idx = numBins - 1; bins[idx]++; });
      const maxCount = Math.max(...bins, 5);

      let axesHTML = `<line x1="${binPlotX}" y1="${binPlotY}" x2="${binPlotX}" y2="${binPlotY + binPlotH}" stroke="#555" stroke-width="2"/>`;
      axesHTML += `<line x1="${binPlotX}" y1="${binPlotY + binPlotH}" x2="${binPlotX + binPlotW}" y2="${binPlotY + binPlotH}" stroke="#555" stroke-width="2"/>`;
      for (let i = 0; i <= 4; i++) axesHTML += `<text x="${binPlotX-10}" y="${binPlotY+binPlotH-(i/4*binPlotH)+5}" text-anchor="end" font-size="14" fill="#555">${Math.round((i/4)*maxCount)}</text>`;

      const barW = binPlotW / numBins, isDishonest = numBins <= 3;
      let barsHTML = '';
      bins.forEach((count, i) => {
        const barH = (count / maxCount) * binPlotH, x = binPlotX + i * barW, y = binPlotY + binPlotH - barH;
        barsHTML += `<rect x="${x}" y="${y}" width="${barW-2}" height="${barH}" fill="${isDishonest?'rgba(255,99,132,0.7)':'rgba(54,162,235,0.7)'}" stroke="${isDishonest?'#ff6384':'#36a2eb'}"></rect>`;
        axesHTML += `<text x="${x+barW/2}" y="${binPlotY+binPlotH+20}" text-anchor="middle" font-size="${numBins>6?10:12}" fill="#555">${Math.round(i*binWidth)}-${Math.round((i+1)*binWidth)}</text>`;
      });
      binAxesGroup.innerHTML = axesHTML; binBarsGroup.innerHTML = barsHTML;
    }
    binSlider.addEventListener('input', renderBins); renderBins();
  </script>
</body>
</html>
