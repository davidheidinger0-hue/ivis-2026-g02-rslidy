<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cherry Picking Demo</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #fff; }
    .flex-col-center { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 850px; }
    .demo-wrapper { width: 100%; margin-bottom: 1.5rem; position: relative; }
    .demo-controls { margin-top: 1rem; text-align: center; width: 100%; }
    .control-row { display: flex; justify-content: space-between; font-size: 1rem; margin-bottom: 0.5rem; }
    .range-slider { width: 100%; cursor: pointer; margin-top: 1rem; }
    .demo-svg { width: 100%; height: auto; overflow: visible; }
    .text-bold { font-weight: bold; }
    .text-success { color: green; }
    .text-danger { color: #cc0000; }
  </style>
</head>
<body>
  <div class="flex-col-center">
    <h2>Cherry Picking</h2>
    <div class="demo-wrapper">
      <svg id="cherrySvg" class="demo-svg" viewBox="0 0 850 450">
        <text x="-200" y="20" transform="rotate(-90)" text-anchor="middle" font-weight="bold" font-size="16" fill="#555">Temperature Anomaly (°C)</text>
        <text x="450" y="440" text-anchor="middle" font-weight="bold" font-size="16" fill="#555">Year</text>
        <g id="cherryAxes"></g>
        <polyline id="cherryLine" fill="none" stroke="#cc0000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"></polyline>
      </svg>
    </div>
    <div class="demo-controls">
      <div class="control-row">
        <span class="text-bold text-success">Full Trend (1970 - 2023)</span>
        <span class="text-bold text-danger">"The Hiatus" (1998 - 2011)</span>
      </div>
      <input type="range" id="cherrySlider" class="range-slider" min="0" max="100" value="0">
    </div>
  </div>

  <script>
    const cherrySlider = document.getElementById('cherrySlider');
    const cherryLine = document.getElementById('cherryLine');
    const cherryAxes = document.getElementById('cherryAxes');
    const climateData = [
      { y: 1970, t: 0.03 }, { y: 1971, t: -0.08 }, { y: 1972, t: 0.01 }, { y: 1973, t: 0.16 }, { y: 1974, t: -0.07 }, { y: 1975, t: -0.01 }, { y: 1976, t: -0.10 }, { y: 1977, t: 0.18 }, { y: 1978, t: 0.07 }, { y: 1979, t: 0.16 },
      { y: 1980, t: 0.26 }, { y: 1981, t: 0.32 }, { y: 1982, t: 0.14 }, { y: 1983, t: 0.31 }, { y: 1984, t: 0.16 }, { y: 1985, t: 0.12 }, { y: 1986, t: 0.18 }, { y: 1987, t: 0.32 }, { y: 1988, t: 0.39 }, { y: 1989, t: 0.27 },
      { y: 1990, t: 0.45 }, { y: 1991, t: 0.40 }, { y: 1992, t: 0.22 }, { y: 1993, t: 0.23 }, { y: 1994, t: 0.32 }, { y: 1995, t: 0.45 }, { y: 1996, t: 0.33 }, { y: 1997, t: 0.46 }, { y: 1998, t: 0.61 }, { y: 1999, t: 0.38 },
      { y: 2000, t: 0.39 }, { y: 2001, t: 0.53 }, { y: 2002, t: 0.63 }, { y: 2003, t: 0.62 }, { y: 2004, t: 0.53 }, { y: 2005, t: 0.68 }, { y: 2006, t: 0.64 }, { y: 2007, t: 0.66 }, { y: 2008, t: 0.54 }, { y: 2009, t: 0.66 },
      { y: 2010, t: 0.73 }, { y: 2011, t: 0.61 }, { y: 2012, t: 0.65 }, { y: 2013, t: 0.68 }, { y: 2014, t: 0.75 }, { y: 2015, t: 0.90 }, { y: 2016, t: 1.02 }, { y: 2017, t: 0.93 }, { y: 2018, t: 0.85 }, { y: 2019, t: 0.98 },
      { y: 2020, t: 1.02 }, { y: 2021, t: 0.85 }, { y: 2022, t: 0.89 }, { y: 2023, t: 1.17 }
    ];
    const cherryPlotX = 70, cherryPlotY = 20, cherryPlotW = 760, cherryPlotH = 360;
    const fullX = [1970, 2023], fullY = [-0.2, 1.3], zoomX = [1998, 2011], zoomY = [0.35, 0.75];

    function updateCherrySVG() {
      const val = parseInt(cherrySlider.value) / 100;
      const ease = val < 0.5 ? 2 * val * val : 1 - Math.pow(-2 * val + 2, 2) / 2;
      const curXMin = fullX[0] + ease * (zoomX[0] - fullX[0]);
      const curXMax = fullX[1] + ease * (zoomX[1] - fullX[1]);
      const curYMin = fullY[0] + ease * (zoomY[0] - fullY[0]);
      const curYMax = fullY[1] + ease * (zoomY[1] - fullY[1]);

      const points = climateData.map(d => {
        const px = cherryPlotX + ((d.y - curXMin) / (curXMax - curXMin)) * cherryPlotW;
        const py = (cherryPlotY + cherryPlotH) - ((d.t - curYMin) / (curYMax - curYMin)) * cherryPlotH;
        return `${px},${py}`;
      }).join(" ");

      cherryLine.setAttribute("points", points);
      cherryLine.setAttribute("clip-path", "url(#cherryClipMask)");

      let axesHTML = `<defs><clipPath id="cherryClipMask"><rect x="${cherryPlotX}" y="${cherryPlotY}" width="${cherryPlotW}" height="${cherryPlotH}" /></clipPath></defs>`;
      axesHTML += `<line x1="${cherryPlotX}" y1="${cherryPlotY}" x2="${cherryPlotX}" y2="${cherryPlotY + cherryPlotH}" stroke="#555" stroke-width="2"/>`;
      axesHTML += `<line x1="${cherryPlotX}" y1="${cherryPlotY + cherryPlotH}" x2="${cherryPlotX + cherryPlotW}" y2="${cherryPlotY + cherryPlotH}" stroke="#555" stroke-width="2"/>`;

      for (let i = 0; i <= 5; i++) {
        const prop = i / 5;
        const valY = curYMin + prop * (curYMax - curYMin);
        const py = (cherryPlotY + cherryPlotH) - (prop * cherryPlotH);
        axesHTML += `<line x1="${cherryPlotX}" y1="${py}" x2="${cherryPlotX + cherryPlotW}" y2="${py}" stroke="#eee"/>`;
        axesHTML += `<text x="${cherryPlotX - 10}" y="${py + 5}" text-anchor="end" font-size="14" fill="#555">${valY.toFixed(2)}</text>`;
      }

      let span = curXMax - curXMin;
      let tickInterval = span > 30 ? 10 : (span > 15 ? 5 : 2);
      for (let y = Math.round(curXMin); y <= Math.round(curXMax); y++) {
        if (y === Math.round(curXMin) || y === Math.round(curXMax) || (y % tickInterval === 0 && (y - Math.round(curXMin)) > tickInterval * 0.6 && (Math.round(curXMax) - y) > tickInterval * 0.6)) {
          let px = cherryPlotX + ((y - curXMin) / span) * cherryPlotW;
          axesHTML += `<line x1="${px}" y1="${cherryPlotY + cherryPlotH}" x2="${px}" y2="${cherryPlotY + cherryPlotH + 5}" stroke="#555"/>`;
          axesHTML += `<text x="${px}" y="${cherryPlotY + cherryPlotH + 25}" text-anchor="middle" font-size="14" fill="#555">${y}</text>`;
        }
      }
      cherryAxes.innerHTML = axesHTML;
    }
    cherrySlider.addEventListener('input', updateCherrySVG);
    updateCherrySVG();
  </script>
</body>
</html>
