<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Time Gap Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .flex-col-center { width: 100%; max-width: 850px; text-align: center; }
    .demo-wrapper { width: 100%; height: 50vh; margin-bottom: 1.5rem; }
    .demo-controls { width: 100%; margin-top: 1rem; }
    .control-row { display: flex; justify-content: space-between; font-weight: bold; color: #888; }
    .range-slider { width: 100%; cursor: pointer; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <div class="flex-col-center">
    <h2>Time Gap</h2>
    <div class="demo-wrapper">
      <canvas id="timeGapChart"></canvas>
    </div>
    <div class="demo-controls">
      <input type="range" id="timeGapSlider" class="range-slider" min="0" max="100" value="0">
      <div class="control-row"><span>All Years Shown</span><span>Stagnant Years Deleted</span></div>
    </div>
  </div>
  <script>
    const fullYears = [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020];
    const fullValues = [10, 11, 9, 12, 10, 13, 11, 12, 10, 14, 11, 12, 10, 13, 11, 12, 10, 11, 12, 60, 85];
    const ctx = document.getElementById('timeGapChart').getContext('2d');
    
    let chart = new Chart(ctx, {
      type: 'bar',
      data: { labels: [...fullYears], datasets: [{ label: 'Revenue', data: [...fullValues], backgroundColor: 'rgba(0, 85, 204, 0.6)', borderColor: '#0055cc', borderWidth: 1 }] },
      options: { responsive: true, maintainAspectRatio: false, animation: { duration: 200 }, scales: { y: { beginAtZero: true, max: 100 } } }
    });

    document.getElementById('timeGapSlider').addEventListener('input', (e) => {
      const val = parseInt(e.target.value), removeCount = Math.round((val / 100) * 18);
      let currentYears = [...fullYears], currentValues = [...fullValues];
      currentYears.splice(1, removeCount); currentValues.splice(1, removeCount);
      
      chart.data.labels = currentYears; chart.data.datasets[0].data = currentValues;
      chart.data.datasets[0].backgroundColor = val > 80 ? 'rgba(204, 0, 0, 0.6)' : 'rgba(0, 85, 204, 0.6)';
      chart.data.datasets[0].borderColor = val > 80 ? '#cc0000' : '#0055cc';
      chart.update();
    });
  </script>
</body>
</html>
