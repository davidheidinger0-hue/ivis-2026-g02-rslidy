<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Visual Encoding 1 (Size) Demo</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .demo-wrapper { width: 100%; max-width: 650px; text-align: center;}
    .switch-container { display: flex; justify-content: center; align-items: center; font-size: 1.2rem; color: #888; margin-top: 2rem; }
    .switch-label-left { width: 120px; text-align: right; } .switch-label-right { width: 120px; text-align: left; }
    .switch { position: relative; display: inline-block; width: 60px; height: 34px; margin: 0 15px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider-toggle { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: green; transition: .4s; border-radius: 34px; }
    .slider-toggle:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider-toggle { background-color: #cc0000; }
    input:checked + .slider-toggle:before { transform: translateX(26px); }
  </style>
</head>
<body>
  <h2>Visual Encoding: Size vs Area</h2>
  <div class="demo-wrapper">
    <svg viewBox="0 0 650 350" style="width:100%; height:auto;">
      <circle cx="160" cy="150" r="60" fill="rgba(0, 85, 204, 0.6)" stroke="#0055cc" stroke-width="3" />
      <text x="160" y="330" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Year 1</text>
      <circle id="svgCircleCompare" cx="470" cy="150" r="84.85" fill="rgba(255, 99, 132, 0.6)" stroke="#cc0000" stroke-width="3" style="transition: r 0.4s ease;" />
      <text x="470" y="330" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Year 2 (100% Increase)</text>
    </svg>
    <div class="switch-container">
      <span id="sizeLabelHonest" class="switch-label-left" style="font-weight:bold; color:green;">2D Area</span>
      <label class="switch"><input type="checkbox" id="svgSizeToggle"><span class="slider-toggle"></span></label>
      <span id="sizeLabelDishonest" class="switch-label-right">1D Radius</span>
    </div>
  </div>
  <script>
    document.getElementById('svgSizeToggle').addEventListener('change', (e) => {
      document.getElementById('svgCircleCompare').setAttribute("r", e.target.checked ? 120 : 84.85);
      document.getElementById('sizeLabelDishonest').style.cssText = e.target.checked ? "font-weight:bold; color:#cc0000;" : "font-weight:normal; color:#888;";
      document.getElementById('sizeLabelHonest').style.cssText = !e.target.checked ? "font-weight:bold; color:green;" : "font-weight:normal; color:#888;";
    });
  </script>
</body>
</html>
