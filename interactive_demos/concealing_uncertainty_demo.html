<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Concealing Uncertainty Demo</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .flex-col-center { width: 100%; max-width: 850px; text-align: center; }
    .demo-wrapper { width: 100%; margin-bottom: 1.5rem; }
    .demo-controls { width: 100%; margin-top: 1rem; }
    .range-slider { width: 100%; cursor: pointer; margin: 1rem 0; }
    .control-row { display: flex; justify-content: space-between; color: #888; }
  </style>
</head>
<body>
  <div class="flex-col-center">
    <h2>Concealing Uncertainty</h2>
    <div class="demo-wrapper">
      <svg id="uncertSvg" viewBox="0 0 850 450" style="width:100%; height:auto;">
        <text x="-200" y="20" transform="rotate(-90)" text-anchor="middle" font-weight="bold" fill="#555">Projected Revenue</text>
        <text x="450" y="440" text-anchor="middle" font-weight="bold" fill="#555">Month</text>
        <g id="uncertAxes"></g>
        <path id="uncertArea" stroke="none"></path>
        <polyline id="uncertLine" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"></polyline>
        <g id="uncertPoints"></g>
      </svg>
    </div>
    <div class="demo-controls">
      <label style="font-size:1.3rem; font-weight:bold;">Confidence Interval Shown: <span id="uncertDisplay" style="color:#cc0000;">0%</span></label>
      <input type="range" id="uncertSlider" class="range-slider" min="0" max="95" value="0" step="1">
      <div class="control-row"><span>0% (Misleading)</span><span>95% (Honest)</span></div>
    </div>
  </div>
  <script>
    const data = [{m:1, y:50, e:2},{m:2, y:52, e:3},{m:3, y:55, e:5},{m:4, y:53, e:8},{m:5, y:58, e:12},{m:6, y:62, e:16},{m:7, y:60, e:20},{m:8, y:65, e:25},{m:9, y:68, e:30},{m:10, y:72, e:36}];
    const pX=70, pY=20, pW=760, pH=360, maxX=10;

    document.getElementById('uncertSlider').addEventListener('input', function() {
      const v = parseInt(this.value), mult = v/95, bad = v<50;
      document.getElementById('uncertDisplay').innerText = v + '%';
      document.getElementById('uncertDisplay').style.color = bad ? '#cc0000' : 'green';
      
      let line=[], up=[], low=[], pts='';
      data.forEach(d => {
        const px = pX+((d.m-1)/(maxX-1))*pW, py = (pY+pH)-(d.y/120)*pH;
        line.push(`${px},${py}`); pts+=`<circle cx="${px}" cy="${py}" r="4" fill="${bad?'#cc0000':'#0055cc'}"></circle>`;
        up.push(`${px},${(pY+pH)-((d.y+(d.e*mult))/120)*pH}`); low.unshift(`${px},${(pY+pH)-((d.y-(d.e*mult))/120)*pH}`);
      });
      document.getElementById('uncertLine').setAttribute('points', line.join(" "));
      document.getElementById('uncertLine').setAttribute('stroke', bad ? '#cc0000' : '#0055cc');
      document.getElementById('uncertArea').setAttribute('d', `M ${up[0]} L ${up.join(" L ")} L ${low.join(" L ")} Z`);
      document.getElementById('uncertArea').setAttribute('fill', bad ? 'rgba(255,99,132,0.25)' : 'rgba(54,162,235,0.25)');
      document.getElementById('uncertPoints').innerHTML = pts;

      let ax = `<line x1="${pX}" y1="${pY}" x2="${pX}" y2="${pY+pH}" stroke="#555" stroke-width="2"/><line x1="${pX}" y1="${pY+pH}" x2="${pX+pW}" y2="${pY+pH}" stroke="#555" stroke-width="2"/>`;
      for(let i=0;i<=4;i++) ax+=`<line x1="${pX}" y1="${(pY+pH)-(i/4)*pH}" x2="${pX+pW}" y2="${(pY+pH)-(i/4)*pH}" stroke="#eee"/><text x="${pX-10}" y="${(pY+pH)-(i/4)*pH+5}" text-anchor="end" fill="#555">${i*30}</text>`;
      for(let i=1;i<=maxX;i++) { const x = pX+((i-1)/(maxX-1))*pW; ax+=`<text x="${x}" y="${pY+pH+25}" text-anchor="middle" fill="#555">M${i}</text><line x1="${x}" y1="${pY+pH}" x2="${x}" y2="${pY+pH+5}" stroke="#555"/>`; }
      document.getElementById('uncertAxes').innerHTML = ax;
    });
    document.getElementById('uncertSlider').dispatchEvent(new Event('input'));
  </script>
</body>
</html>
